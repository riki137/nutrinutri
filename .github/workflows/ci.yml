name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # A real Android build (unsigned/debug) catches toolchain drift — e.g. a
  # Flutter stable bump raising the minimum Android Gradle Plugin version —
  # that analyze/test never sees. No signing secrets needed for a debug build.
  build_android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --debug

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build web --release --base-href "/nutrinutri/"

  # Packages the Linux build as a Flatpak to smoke-test flatpak/*.yml — a
  # broken manifest, desktop file, or metainfo would otherwise only surface
  # at release time.
  build_flatpak:
    name: Build Flatpak (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Point Flatpak manifest at this build
        run: |
          tar -czf flatpak/nutrinutri-linux.tar.gz -C build/linux/x64/release/bundle .
          SHA256=$(sha256sum flatpak/nutrinutri-linux.tar.gz | cut -d' ' -f1)
          cat > flatpak/nutrinutri-source.json <<EOF
          [{"type": "archive", "path": "nutrinutri-linux.tar.gz", "sha256": "$SHA256"}]
          EOF
      - name: Install flatpak-builder
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Pre-install as root: the action runs as the unprivileged runner
          # user, and an unprivileged `flatpak --system install` needs
          # polkit, which isn't available headless.
          RUNTIME_VERSION=$(grep '^runtime-version:' flatpak/sk.popelis.nutrinutri.yml | awk '{print $2}' | tr -d "'\"")
          sudo flatpak install -y flathub "org.gnome.Platform//$RUNTIME_VERSION" "org.gnome.Sdk//$RUNTIME_VERSION"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nutrinutri-linux.flatpak
          manifest-path: flatpak/sk.popelis.nutrinutri.yml
          cache-key: flatpak-builder-${{ github.sha }}
